# =============================================================================
# SOC Sentinel — Docker Compose pour Dokploy
# Usage : docker compose -f docker-compose.dokploy.yml up -d --build
# =============================================================================
# App (Express + statiques) + PostgreSQL/pgvector persistant.
# HTTPS et routing : Traefik / Dokploy en amont. L'app écoute en HTTP.
# SESSION_SECRET est obligatoire (config.js throw en production sans lui).
# =============================================================================

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    # Derrière Traefik/Dokploy : req.ip = vraie IP client (rate-limit login + logs)
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 2311
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET obligatoire — openssl rand -hex 48}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      # Cookie Secure : true derrière HTTPS Traefik
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Base PostgreSQL persistante (volume soc-pgdata) — historique, chat, RAG.
      # DB_ENABLED forcé à true : la base fait partie du déploiement.
      DB_ENABLED: "true"
      DATABASE_URL: ${DATABASE_URL:-postgresql://soc:soc@db:5432/soc}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      DB_SYNC_ENABLED: ${DB_SYNC_ENABLED:-true}
      DB_SYNC_INTERVAL_MIN: ${DB_SYNC_INTERVAL_MIN:-15}
      # Fenêtre de synchro = PAGE_SIZE × MAX_PAGES. Mesurée sur la console
      # réelle : 1 321 endpoints, 5 033 menaces, 12 210 alertes → 1 000 × 20
      # = 20 000 objets par entité et par run, largement au-dessus du parc.
      # Fixé en dur (comme DB_ENABLED) : l'env Dokploy écrase les `:-` par
      # défaut, et une fenêtre trop petite bloque la synchro sous le total
      # (« fenêtre … tronquée » + pointeurs figés).
      DB_SYNC_PAGE_SIZE: "1000"
      DB_SYNC_MAX_PAGES: "20"
      # Journal d'activités (~50 000 lignes) : plafond souple dédié — la passe
      # complète garde les plus récentes sans bloquer la réconciliation.
      DB_SYNC_ACTIVITY_MAX_PAGES: "5"
      # Synchro incrémentale : la fenêtre de recouvrement (min) évite les trous
      # si le watermark avance entre deux runs ; la réconciliation (min) force
      # périodiquement une passe complète pour rattraper les objets anciens.
      DB_SYNC_OVERLAP_MIN: ${DB_SYNC_OVERLAP_MIN:-15}
      DB_SYNC_RECONCILE_MIN: ${DB_SYNC_RECONCILE_MIN:-60}
      # Anti-rafale du bouton « Rafraîchir » (ms entre deux synchros forcées).
      DB_SYNC_REFRESH_MIN_MS: ${DB_SYNC_REFRESH_MIN_MS:-10000}
      # Inventaire des applications (vue « Applications ») : 1 appel SentinelOne
      # par endpoint (~1 300) → cadence lente, séparée du delta principal.
      DB_SYNC_APPS_MIN: ${DB_SYNC_APPS_MIN:-360}
      EMBEDDINGS_DIM: ${EMBEDDINGS_DIM:-1536}

      # IA / chat / voix (les providers sont configurés dans la BDD, pas en env)
      AI_CHAT_ENABLED: ${AI_CHAT_ENABLED:-true}
      AI_CHAT_DAILY_QUOTA: ${AI_CHAT_DAILY_QUOTA:-500}
      AI_CHAT_RATE_LIMIT: ${AI_CHAT_RATE_LIMIT:-120}
      AI_RAG_INDEX_ENABLED: ${AI_RAG_INDEX_ENABLED:-true}
      VOICE_ENABLED: ${VOICE_ENABLED:-true}
      VOICE_LIVE_PATH: ${VOICE_LIVE_PATH:-/voice-live}

      # Active Directory / LDAP
      LDAP_ENABLED: ${LDAP_ENABLED:-true}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_EMAIL_DOMAIN: ${LDAP_EMAIL_DOMAIN:-}
      LDAP_BIND_DOMAIN: ${LDAP_BIND_DOMAIN:-}
      LDAP_BIND_FORMAT: ${LDAP_BIND_FORMAT:-{username}@{domain}}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_STARTTLS: ${LDAP_STARTTLS:-true}
      LDAP_TLS_STRICT: ${LDAP_TLS_STRICT:-false}
      LDAP_ADMIN_USERNAMES: ${LDAP_ADMIN_USERNAMES:-}
      LDAP_CONNECT_TIMEOUT_MS: ${LDAP_CONNECT_TIMEOUT_MS:-5000}
      LDAP_TIMEOUT_MS: ${LDAP_TIMEOUT_MS:-12000}

      # API SentinelOne Management
      S1_URL: ${S1_URL:-}
      S1_API_TOKEN: ${S1_API_TOKEN:-}
      S1_TIMEOUT_MS: ${S1_TIMEOUT_MS:-15000}
      S1_CACHE_TTL_MS: ${S1_CACHE_TTL_MS:-20000}
      S1_SAMPLE_LIMIT: ${S1_SAMPLE_LIMIT:-1000}
      S1_PAGE_SIZE: ${S1_PAGE_SIZE:-25}
      S1_TLS_INSECURE: ${S1_TLS_INSECURE:-false}

      # Migration Singularity Operations Center (bannière)
      S1_MIGRATION_BANNER: ${S1_MIGRATION_BANNER:-true}
      S1_MIGRATION_DEFAULT_DATE: ${S1_MIGRATION_DEFAULT_DATE:-2026-11-02}
      S1_MIGRATION_RETIREMENT_DATE: ${S1_MIGRATION_RETIREMENT_DATE:-2027-06-01}
      S1_MIGRATION_DOC_URL: ${S1_MIGRATION_DOC_URL:-}

      # Limitation des tentatives de connexion
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}

      # Connexion de développement (désactivée en production par config.js).
      # À activer UNIQUEMENT si LDAP n'est pas encore configuré, avec un mot de passe fort.
      AUTH_DEV_LOGIN: ${AUTH_DEV_LOGIN:-false}
      AUTH_DEV_USER: ${AUTH_DEV_USER:-admin}
      AUTH_DEV_PASSWORD: ${AUTH_DEV_PASSWORD:-}
    # Port publié sur l'hôte pour accès direct (ex: http://localhost:2311).
    # Dokploy/Traefik écoute sur 3000/443 : sans labels Traefik configurés,
    # c'est le moyen le plus fiable de joindre l'app en direct.
    # Pas de TLS dans le container — Traefik termine HTTPS si on ajoute un domaine.
    ports:
      - "2311:2311"
    expose:
      - "2311"
    networks:
      - soc-network
      - dokploy-network

  # PostgreSQL + pgvector — historique SOC, conversations, providers IA, embeddings.
  # Volume nommé : les données survivent aux rebuilds du container app.
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc}
      POSTGRES_DB: ${POSTGRES_DB:-soc}
    volumes:
      - soc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - soc-network

volumes:
  soc-pgdata:

networks:
  soc-network:
    driver: bridge
  dokploy-network:
    external: true
