<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <title>Connexion | SOC Sentinel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Console de supervision SentinelOne — accès Active Directory." />
    <meta name="robots" content="noindex, nofollow" />

    <link rel="shortcut icon" href="/assets/images/favicon.ico">
    <script src="/assets/js/config.js"></script>
    <link href="/assets/css/vendor.min.css" rel="stylesheet" type="text/css" />
    <link href="/assets/css/app.min.css" rel="stylesheet" type="text/css" id="app-style" />
    <link href="/assets/css/icons.min.css" rel="stylesheet" type="text/css" />
    <link href="/css/soc.css" rel="stylesheet" type="text/css" />
</head>

<body>

    <div class="auth-bg d-flex min-vh-100 justify-content-center align-items-center">
        <div class="row g-0 justify-content-center w-100 m-xxl-5 px-xxl-4 m-3">
            <div class="col-xl-4 col-lg-5 col-md-6">
                <div class="card overflow-hidden text-center h-100 p-xxl-4 p-3 mb-0">
                    <a href="/login" class="auth-brand mb-3">
                        <span class="soc-login-logo bg-primary text-white mx-auto">
                            <i class="ti ti-shield-lock fs-28"></i>
                        </span>
                    </a>

                    <h4 class="fw-semibold mb-2">Console SOC</h4>
                    <p class="text-muted mb-4">
                        Connectez-vous avec votre compte <span class="fw-semibold">Active Directory</span>
                        pour superviser votre instance SentinelOne.
                    </p>

                    <div id="login-error" class="text-start"></div>

                    <form id="login-form" class="text-start mb-3" novalidate>
                        <div class="mb-3">
                            <label class="form-label" for="username">Identifiant AD</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="ti ti-user fs-17"></i></span>
                                <input type="text" class="form-control" id="username" name="username"
                                    placeholder="prenom.nom" autocomplete="username" autocapitalize="none"
                                    spellcheck="false" required maxlength="128">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="password">Mot de passe</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="ti ti-lock fs-17"></i></span>
                                <input type="password" class="form-control" id="password" name="password"
                                    placeholder="Votre mot de passe AD" autocomplete="current-password" required
                                    maxlength="256">
                                <button class="btn btn-outline-primary" type="button" id="toggle-password"
                                    aria-label="Afficher le mot de passe">
                                    <i class="ti ti-eye fs-17"></i>
                                </button>
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button class="btn btn-primary btn-lg" type="submit" id="login-submit">
                                <span class="spinner-border spinner-border-sm me-2 d-none" id="login-spinner"
                                    aria-hidden="true"></span>
                                <span id="login-submit-label">Se connecter</span>
                            </button>
                        </div>
                    </form>

                    <div class="alert alert-light border-dashed text-start fs-13 mb-3" role="note">
                        <i class="ti ti-info-circle me-1"></i>
                        L’authentification est déléguée à l’annuaire Active Directory. Aucun mot de passe
                        n’est stocké par la plateforme.
                    </div>

                    <p class="mt-auto mb-0 fs-12 text-muted">
                        <span data-soc-year></span> © SOC Sentinel — Supervision SentinelOne
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/js/vendor.min.js"></script>
    <script src="/js/login.js"></script>

</body>

</html>
